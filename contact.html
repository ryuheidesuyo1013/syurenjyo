    <main>
        <div class="contact">
            <h1 class="contact-ttl">お問い合わせ</h1>
            <form action="process_contact.php" method="post">
                <table class="contact-table">
                    <tr>
                        <th class="contact-item">名前<br>(<span class="red">必須</span>)</th>
                        <td class="contact-body">
                            <input type="text" name="名前" class="form-text" />
                        </td>
                    </tr>
                    <tr>
                        <th class="contact-item">所属クラブ<br>(任意)</th>
                        <td class="contact-body">
                            <input type="text" name="クラブ" class="form-text" />
                        </td>
                    </tr>
                    <tr>
                        <th class="contact-item">チーム内役割<br>(<span class="red">必須</span>)</th>
                        <td class="contact-body">
                            <select name="役割" class="form-select">
                                <option>選択してください</option>
                                <option>選手</option>
                                <option>監督、コーチ</option>
                                <option>マネージャー</option>
                                <option>保護者</option>
                                <option>その他</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <th class="contact-item">メールアドレス<br>(<span class="red">必須</span>)</th>
                        <td class="contact-body">
                            <input type="email" name="メール" class="form-text" />
                        </td>
                    </tr>
                    <tr>
                        <th class="contact-item">メールアドレス<br>(確認)<br>(<span class="red">必須</span>)</th>
                        <td class="contact-body">
                            <input type="email" name="メール確認" class="form-text" />
                        </td>
                    </tr>
                    <tr>
                        <th class="contact-item">お問い合わせ内容<br>(<span class="red">必須</span>)</th>
                        <td class="contact-body">
                            <textarea name="問い合わせ" class="form-textarea"></textarea>
                        </td>
                    </tr>
                </table>
                <input class="contact-submit" type="submit" value="送信" />
            </form>
        </div>
